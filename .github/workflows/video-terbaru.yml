name: 🎬 Perbarui Video YouTube Terbaru

on:
  schedule:
    # Setiap hari 00:00 UTC (±07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-terbaru
  cancel-in-progress: false

jobs:
  perbarui-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ambil RSS YouTube & tulis youtube.json
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'docs/public/data/youtube.json'
          const CHANNEL_ID = 'UCbEPa8MAlTIzLkm_5brGjGQ'
          const RSS_URL = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`
          const MAKS_VIDEO = 6
          const MAKS_SHORTS = 8
          const PANJANG_DESKRIPSI = 300
          const MIRROR_URL = `https://inv.nadeko.net/feed/channel/${CHANNEL_ID}`
          const HEADERS = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
            'Accept': 'application/atom+xml,application/xml;q=0.9,*/*;q=0.8',
          }

          function xmlUnescape(s) {
            return s
              .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
              .replace(/&#x([0-9a-fA-F]+);/g, (_, h) => String.fromCodePoint(parseInt(h, 16)))
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&amp;/g, '&')
          }

          function potongDeskripsi(s) {
            if (s.length <= PANJANG_DESKRIPSI) return s
            return s.slice(0, PANJANG_DESKRIPSI).replace(/\s+\S*$/, '') + '…'
          }

          async function ambilFeed(url, coba = 3) {
            let status = 0
            for (let i = 1; i <= coba; i++) {
              const res = await fetch(url, { headers: HEADERS })
              status = res.status
              if (res.ok) return res.text()
              const layakUlang = status === 404 || status === 429 || status >= 500
              if (!layakUlang || i === coba) break
              console.log(`RSS HTTP ${status}, coba lagi (${i}/${coba})...`)
              await new Promise(tunggu => setTimeout(tunggu, 2000 * i))
            }
            throw new Error(`RSS HTTP ${status}`)
          }

          async function main() {
            let xml
            try {
              xml = await ambilFeed(RSS_URL)
              if (!xml.includes('<entry>')) throw new Error('feed tanpa entry')
            } catch (utama) {
              console.warn(`RSS utama gagal: ${utama.message}. Coba mirror...`)
              try {
                xml = await ambilFeed(MIRROR_URL, 1)
                if (!xml.includes('<entry>')) throw new Error('mirror tanpa entry')
              } catch (mirror) {
                console.warn(`RSS mirror gagal: ${mirror.message}. Pakai youtube.json yang lama.`)
                return
              }
            }

            const entries = xml.split('<entry>').slice(1).map(e => e.split('</entry>')[0])
            const semua = entries.map(entry => {
              const ambil = tag => {
                const m = entry.match(new RegExp(`<${tag}[^>]*>([\\s\\S]*?)</${tag}>`))
                return m ? m[1] : ''
              }
              const thumbMatch = entry.match(/<media:thumbnail[^>]*url="([^"]+)"/)
              const linkMatch = entry.match(/<link[^>]*rel="alternate"[^>]*href="([^"]+)"/)
              const url = linkMatch ? xmlUnescape(linkMatch[1]) : ''
              return {
                id: xmlUnescape(ambil('yt:videoId')),
                title: xmlUnescape(ambil('title')),
                published: xmlUnescape(ambil('published')),
                thumbnail: thumbMatch ? xmlUnescape(thumbMatch[1]) : '',
                description: potongDeskripsi(xmlUnescape(ambil('media:description')).replace(/\s+/g, ' ').trim()),
                isShort: url.includes('/shorts/'),
              }
            }).filter(v => v.id && v.title)

            const rapikan = ({ isShort, ...v }) => v
            const videos = semua.filter(v => !v.isShort).slice(0, MAKS_VIDEO).map(rapikan)
            const shorts = semua.filter(v => v.isShort).slice(0, MAKS_SHORTS).map(rapikan)

            if (videos.length === 0 && shorts.length === 0) {
              throw new Error('RSS tidak berisi video')
            }

            const baru = {
              channelId: CHANNEL_ID,
              diperbarui: new Date().toISOString(),
              videos,
              shorts,
            }
            const isiBaru = JSON.stringify(baru, null, 2) + '\n'

            const lama = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : ''
            if (lama === isiBaru) {
              console.log('Tidak ada video baru, lewati commit.')
              return
            }

            fs.writeFileSync(path, isiBaru)
            console.log(`youtube.json diperbarui: ${videos.length} video, ${shorts.length} shorts.`)
          }

          main().catch(err => { console.error(err); process.exit(1) })
          EOF

      - name: Commit jika ada perubahan
        run: |
          if git diff --quiet docs/public/data/youtube.json; then
            echo "Tidak ada perubahan."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/public/data/youtube.json
            git commit -m "chore(data): perbarui daftar video YouTube"
            git push
          fi
